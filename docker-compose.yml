version: '3.8'

services:
  # 1. Base de Datos - PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: pambazo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pambazo_db}
      POSTGRES_USER: ${DB_USER:-pambazo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pambazo123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init/01-init-database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - pambazo-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-pambazo_user} -d ${DB_NAME:-pambazo_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Almacenamiento de Objetos - MinIO (S3 Compatible)
  minio:
    image: minio/minio
    container_name: pambazo-minio
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pambazo_minio_secret}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - pambazo-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # 3. Backend - Node.js API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pambazo-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-pambazo_db}
      - DB_USER=${DB_USER:-pambazo_user}
      - DB_PASSWORD=${DB_PASSWORD:-pambazo123}
      - JWT_SECRET=${JWT_SECRET:-tu_clave_secreta_super_segura_2024}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-pambazo_minio_secret}
      - MINIO_BUCKET=${MINIO_BUCKET:-pambazo-images}
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - pambazo-network

  # 4. Frontend - React served by Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3001/api/v1}
    container_name: pambazo-frontend
    restart: unless-stopped
    ports:
      - "80:6001"
    networks:
      - pambazo-network
    depends_on:
      - backend

networks:
  pambazo-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
